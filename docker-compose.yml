services:
  mongo:
    image: mongo:8.0
    container_name: bizzflow-mongo

    restart: unless-stopped

    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all

    ports:
      - "27017:27017"

    volumes:
      - bizzflow_mongo_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:8.0
    container_name: bizzflow-mongo-init

    depends_on:
      mongo:
        condition: service_healthy

    restart: "no"

    entrypoint:
      - mongosh
      - mongodb://mongo:27017/admin
      - --quiet
      - --eval
      - "try { rs.status() } catch (error) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }"

volumes:
  bizzflow_mongo_data: